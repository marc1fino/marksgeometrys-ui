[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marksgeometrys-ui"
version = "0.1.0"
description = "Visual interface for the marksgeometrys geometry library - calculate areas and volumes of 2D and 3D shapes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Marc", email = "marc@example.com"}
]
keywords = ["geometry", "calculator", "area", "volume", "shapes", "pyqt", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Desktop Environment",
]
dependencies = [
    "marksgeometrys>=0.1.1",
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
marksgeometrys-ui = "marksgeometrys_ui.__main__:main"
mgui = "marksgeometrys_ui.__main__:main"

[project.urls]
Homepage = "https://github.com/marc1fino/marksgeometrys-ui"
Repository = "https://github.com/marc1fino/marksgeometrys-ui"
Issues = "https://github.com/marc1fino/marksgeometrys-ui/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marksgeometrys_ui = ["assets/*.svg", "assets/fonts/*.ttf", "assets/fonts/*-OFL.txt"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
